; ============================================
; KNOMI V1 (solis_knomi) — Flash Download Tool Config
; 芯片: ESP32-D0WDQ6-V3, 4MB Flash
; ============================================
; 使用方法:
;   1. 打开 flash_download_tool_3.9.10.exe
;   2. 选择 ChipType: ESP32
;   3. 加载此配置文件
;   4. 选择 COM 端口，点击 START
; ============================================

[MULTI_UI_CONFIG]
multi_col = 2

[DOWNLOAD PATH]
; bootloader.bin @ 0x1000
file_sel0 = 0
file_path0 = ..\solis_knomi\release\bootloader.bin
file_flag0 = True
file_offset0 = 0x1000

; partitions.bin @ 0x8000
file_sel1 = 0
file_path1 = ..\solis_knomi\release\partitions.bin
file_flag1 = True
file_offset1 = 0x8000

; firmware.bin @ 0x10000
file_sel2 = 0
file_path2 = ..\solis_knomi\release\firmware.bin
file_flag2 = True
file_offset2 = 0x10000

; littlefs.bin @ 0x300000
file_sel3 = 0
file_path3 = ..\solis_knomi\release\littlefs.bin
file_flag3 = True
file_offset3 = 0x300000

; 以下为预留空位
file_sel4 = 0
file_path4 = 
file_flag4 = False
file_offset4 = 
file_sel5 = 0
file_path5 = 
file_flag5 = False
file_offset5 = 
file_sel6 = 0
file_path6 = 
file_flag6 = False
file_offset6 = 
